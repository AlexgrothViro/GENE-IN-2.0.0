        <a class="gi-appbar__brand" href="#/home">

        <button id="menu-toggle" class="gi-appbar__advanced menu-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation">Menu</button>

      <div id="route-view" aria-busy="true"></div>

    <div id="notifications" class="notifications" aria-live="polite" aria-atomic="true"></div>
    <div id="modal-root"></div>
