name: Engineering tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  engineering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install this checkout and test dependencies
        run: |
          python -m pip install setuptools wheel
          python -m pip install --no-build-isolation -e '.[dev]'
      - name: Run engineering checks
        env:
          PYTHONPATH: .:src
        run: make test

  index-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install index tools and this checkout
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ncbi-blast+ bowtie2
          python -m pip install setuptools wheel
          python -m pip install --no-build-isolation -e '.[dev]'
      - name: Check real index metadata only
        env:
          PYTHONPATH: .:src
          GENEIN_TEST_ARTIFACT_ROOT: ${{ runner.temp }}/index-metadata
        run: |
          python -m pytest -q -s -p no:cacheprovider scripts/tests/test_real_index_metadata.py scripts/tests/test_db_manager_paths.py scripts/tests/evidence/test_blast_database_promotion.py scripts/tests/test_competitive_labels.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: index-metadata
          path: ${{ runner.temp }}/index-metadata
          if-no-files-found: warn

  optional-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real tools and this checkout
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ncbi-blast+ bowtie2 samtools fastp velvet
          python -m pip install setuptools wheel
          python -m pip install --no-build-isolation -e .
      - name: Real FASTQ to receipt, four optional configurations
        env:
          GENEIN_TEST_ARTIFACT_ROOT: ${{ runner.temp }}/optional-e2e
          PYTHONNOUSERSITE: '1'
        run: make e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optional-e2e
          path: ${{ runner.temp }}/optional-e2e
          if-no-files-found: error
